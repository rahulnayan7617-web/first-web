<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rahul Nayan's first website with Firebase login">
    <title>Rahul Nayan - Protected Website</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        #loginArea { 
            position: fixed; top: 20px; right: 20px; z-index: 1000; 
        }
        .login-btn, .logout-btn {
            padding: 12px 24px; background: #667eea; color: white; 
            border: none; border-radius: 25px; cursor: pointer; 
            font-weight: bold; font-size: 14px;
        }
        .logout-btn { background: #ff6b6b; }
        .logout-btn:hover { background: #ff5252; }
        #mainContent { 
            max-width: 1000px; margin: 80px auto 20px; 
            background: white; padding: 30px; border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }
        .modal {
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.7); 
            z-index: 9999; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; width: 90%; max-width: 420px; 
            margin: 100px auto; padding: 40px; border-radius: 20px; 
            position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .close { 
            position: absolute; right: 20px; top: 15px; 
            font-size: 30px; cursor: pointer; color: #999; 
        }
        .close:hover { color: #333; }
        input, textarea {
            width: 100%; padding: 18px; margin: 12px 0; 
            border: 2px solid #e1e5e9; border-radius: 12px; 
            font-size: 16px; transition: all 0.3s;
        }
        textarea { min-height: 140px; resize: vertical; font-family: inherit; }
        .phone-input { display: flex; align-items: center; gap: 8px; }
        .country-code { padding: 18px 12px; background: #f1f3f5; border: 2px solid #e1e5e9; border-radius: 12px; font-weight: bold; }
        .phone-input input { flex: 1; }
        input:focus, textarea:focus {
            outline: none; border-color: #667eea; 
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        button {
            width: 100%; padding: 18px; margin: 12px 0; 
            border: none; border-radius: 12px; font-size: 16px; 
            font-weight: bold; cursor: pointer; transition: all 0.3s;
        }
        .login-btn { background: #667eea; color: white; }
        .login-btn:hover { background: #5a67d8; transform: translateY(-2px); }
        .register-btn { background: #28a745; color: white; }
        .register-btn:hover { background: #218838; transform: translateY(-2px); }
        .switch { 
            text-align: center; cursor: pointer; 
            color: #667eea; margin-top: 20px; font-weight: 500;
        }
        .switch:hover { text-decoration: underline; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px; text-align: left; border: 1px solid #ddd; }
        th { background: #667eea; color: white; }
        img { max-width: 100%; height: auto; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="loginArea">
        <button class="login-btn" onclick="window.showLogin()">🔐 Login</button>
    </div>

    <div id="mainContent">
        <h1>Welcome to my first website!</h1>
        <h4>by Rahul Nayan</h4>
        <p style="background-color: rgb(129, 155, 14); padding: 15px; border-radius: 8px; color: white;">
            This is a paragraph on my first webpage.
        </p>

        <table>
            <tr><th colspan="6">🚀 Weblinks</th></tr>
            <tr>
                <td><img width="30" height="30" src="download.webp" alt="Google"><a target="_blank" href="https://www.google.com"> Google</a></td>
                <td><img width="30" height="30" src="instagram.webp" alt="Instagram"><a target="_blank" href="https://www.instagram.com"> Instagram</a></td>
                <td><img width="30" height="30" src="free fire image.webp" alt="Free Fire"><a target="_blank" href="https://ff.garena.com"> Free Fire</a></td>
                <td><img width="30" height="30" src="chat.webp" alt="ChatGPT"><a target="_blank" href="https://chatgpt.com"> ChatGPT</a></td>
                <td><img width="30" height="30" src="perplexity.webp" alt="Perplexity"><a target="_blank" href="https://www.perplexity.ai"> Perplexity</a></td>
                <td><a href="https://github.com" target="_blank">🐙 GitHub</a></td>
            </tr>
        </table>

        <img width="500" height="500" src="WhatsApp Image 2024-01-19 at 8.21.37 AM.jpeg" alt="Anime" style="margin: 20px 0;">
        
        <h1>📝 Contact Form</h1>
        <form id="profileForm" novalidate style="max-width: 500px;">
            <label for="yourname" style="display: block; margin-bottom: 10px; font-weight: bold;">Name</label>
            <input type="text" id="yourname" name="name" placeholder="Enter your name" autocomplete="name" minlength="2" maxlength="80" required autofocus>

            <label for="contactEmail" style="display: block; margin-bottom: 10px; font-weight: bold;">Email</label>
            <input type="email" id="contactEmail" name="email" placeholder="you@example.com" autocomplete="email" maxlength="120" required>

            <label for="phone" style="display: block; margin-bottom: 10px; font-weight: bold;">Phone</label>
            <div class="phone-input">
                <span class="country-code" aria-label="India country code">+91</span>
                <input type="tel" id="phone" name="phone" placeholder="98765 43210" autocomplete="tel-national" inputmode="numeric" minlength="10" maxlength="10" pattern="[6-9][0-9]{9}" required>
            </div>

            <label for="message" style="display: block; margin-bottom: 10px; font-weight: bold;">Message</label>
            <textarea id="message" name="message" placeholder="Write your message" minlength="10" maxlength="1000" required></textarea>

            <button type="submit" class="login-btn">Send Message</button>
            <p id="formStatus" role="status" aria-live="polite" style="min-height: 24px; margin-top: 10px;"></p>
        </form>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="window.closeLogin()">&times;</span>
            
            <div id="loginForm">
                <h2 style="margin-bottom: 25px; text-align: center; color: #333;">🔐 Welcome Back</h2>
                <input id="email" type="email" placeholder="📧 Enter your email" autocomplete="email">
                <input id="password" type="password" placeholder="🔒 Enter your password">
                <button type="button" class="login-btn" id="loginButton">Sign In</button>
                <button type="button" class="register-btn" id="resendVerificationButton" onclick="window.resendVerificationEmail()">Resend Verification Email</button>
                <p id="verificationStatus" role="status" aria-live="polite" style="min-height: 24px; margin-top: 10px;"></p>
                <div class="switch" onclick="window.showRegister()">Don't have account? 📝 Register</div>
            </div>

            <div id="registerForm" class="hidden">
                <h2 style="margin-bottom: 25px; text-align: center; color: #333;">📝 Create Account</h2>
                <input id="regUsername" type="text" placeholder="👤 Create a username" autocomplete="username">
                <input id="regEmail" type="email" placeholder="📧 Enter your email" autocomplete="email">
                <input id="regPassword" type="password" placeholder="🔒 Create password (6+ chars)">
                <button type="button" class="register-btn" onclick="window.register()">Create Account</button>
                <div class="switch" onclick="window.showLogin()">Already have account? 🔐 Login</div>
            </div>
        </div>
    </div>

    <script type="module">
        // FIXED: MATCHING FIREBASE VERSIONS (10.8.1)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEF3w3xaLBQw3ctkdikywqiXy9hvr00Bg",
            authDomain: "rahul-sfirst-web.firebaseapp.com",
            databaseURL: "https://rahul-sfirst-web-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rahul-sfirst-web",
            storageBucket: "rahul-sfirst-web.firebasestorage.app",
            messagingSenderId: "813239852248",
            appId: "1:813239852248:web:91d29ed494917ad6e30bad",
            measurementId: "G-74DMWXDQRX"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const profileForm = document.getElementById('profileForm');
        const formStatus = document.getElementById('formStatus');
        const verificationStatus = document.getElementById('verificationStatus');
        const resendVerificationButton = document.getElementById('resendVerificationButton');
        let authFlowInProgress = false;
        let resendCooldown = 0;

        const getAuthErrorMessage = (error) => {
            switch (error.code) {
                case 'auth/email-already-in-use': return 'This email is already registered. Please log in instead.';
                case 'auth/weak-password': return 'Your password is too weak. Use at least 6 characters.';
                case 'auth/invalid-email': return 'Please enter a valid email address.';
                case 'auth/network-request-failed': return 'Network error. Check your internet connection and try again.';
                case 'auth/user-token-expired': return 'Your session expired. Please log in again.';
                case 'auth/too-many-requests': return 'Too many attempts. Please wait and try again later.';
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                case 'auth/user-not-found': return 'The email or password is incorrect.';
                default: return error.message || 'Something went wrong. Please try again.';
            }
        };

        profileForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            formStatus.textContent = '';
            formStatus.style.color = '#dc3545';

            const name = document.getElementById('yourname').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const phone = document.getElementById('phone').value.replace(/\D/g, '');
            const message = document.getElementById('message').value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phonePattern = /^[6-9]\d{9}$/;

            if (name.length < 2 || name.length > 80 || !/^[\p{L}\s.'-]+$/u.test(name)) {
                formStatus.textContent = 'Please enter a valid name (2-80 letters).';
                return;
            }
            if (!emailPattern.test(email) || email.length > 120) {
                formStatus.textContent = 'Please enter a valid email address.';
                return;
            }
            if (!phonePattern.test(phone)) {
                formStatus.textContent = 'Please enter a valid phone number.';
                return;
            }
            if (message.length < 10 || message.length > 1000) {
                formStatus.textContent = 'Your message must be between 10 and 1000 characters.';
                return;
            }
            if (!auth.currentUser || !auth.currentUser.emailVerified) {
                formStatus.textContent = 'Please verify your email and log in before sending the form.';
                return;
            }

            const submitButton = profileForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            try {
                await set(ref(database, `profiles/${auth.currentUser.uid}`), {
                    uid: auth.currentUser.uid,
                    accountEmail: auth.currentUser.email,
                    username: auth.currentUser.displayName || '',
                    name,
                    email,
                    phone: `+91${phone}`,
                    message,
                    submittedAt: serverTimestamp()
                });
                profileForm.reset();
                formStatus.style.color = '#198754';
                formStatus.textContent = 'Your message was sent successfully.';
            } catch (error) {
                console.error('Profile submission failed:', error);
                if (error.code === 'auth/user-token-expired') {
                    await signOut(auth);
                    formStatus.textContent = 'Your session expired. Please log in again.';
                } else if (error.code === 'PERMISSION_DENIED') {
                    formStatus.textContent = 'Firebase denied this submission. Update your Realtime Database Rules.';
                } else {
                    formStatus.textContent = `Could not send your message: ${error.message}`;
                }
            } finally {
                submitButton.disabled = false;
            }
        });

        // 🌟 GLOBAL FUNCTIONS (for onclick)
        window.showLogin = () => {
            document.getElementById('loginModal').style.display = 'block';
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        };

        window.closeLogin = () => {
            document.getElementById('loginModal').style.display = 'none';
        };

        window.showRegister = () => {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        };

        window.showLoginForm = () => {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        };

        // 📝 REGISTER NEW USER
        window.register = async () => {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!username) {
                return alert('❌ Please create a username.');
            }
            if (!emailPattern.test(email)) {
                return alert('❌ Please enter a valid email address.');
            }
            if (!password || password.length < 6) {
                return alert('❌ Password must be at least 6 characters.');
            }
            
            authFlowInProgress = true;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: username });
                await sendEmailVerification(userCredential.user);
                await signOut(auth);
                alert('✅ Account created. A verification email has been sent. Verify your email before logging in.');
                document.getElementById('regUsername').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regPassword').value = '';
                window.showLoginForm(); // FIXED: Added window.
            } catch (error) {
                alert('❌ Registration failed: ' + getAuthErrorMessage(error));
            } finally {
                authFlowInProgress = false;
            }
        };

        window.resendVerificationEmail = async () => {
            if (resendCooldown > 0) {
                verificationStatus.style.color = '#dc3545';
                verificationStatus.textContent = `Please wait ${resendCooldown} seconds before requesting another email.`;
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email) || !password) {
                verificationStatus.style.color = '#dc3545';
                verificationStatus.textContent = 'Enter your email and password first.';
                return;
            }

            resendVerificationButton.disabled = true;
            authFlowInProgress = true;
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                await userCredential.user.reload();
                if (userCredential.user.emailVerified) {
                    verificationStatus.style.color = '#198754';
                    verificationStatus.textContent = 'Your email is already verified. You can log in.';
                    resendVerificationButton.disabled = false;
                } else {
                    await sendEmailVerification(userCredential.user);
                    verificationStatus.style.color = '#198754';
                    verificationStatus.textContent = 'A new verification email has been sent.';
                    resendCooldown = 60;
                    const cooldownTimer = setInterval(() => {
                        resendCooldown -= 1;
                        if (resendCooldown <= 0) {
                            clearInterval(cooldownTimer);
                            resendVerificationButton.disabled = false;
                            verificationStatus.textContent = 'You can request another verification email.';
                        } else {
                            verificationStatus.textContent = `Verification email sent. Try again in ${resendCooldown} seconds.`;
                        }
                    }, 1000);
                }
                await signOut(auth);
            } catch (error) {
                verificationStatus.style.color = '#dc3545';
                verificationStatus.textContent = getAuthErrorMessage(error);
                resendVerificationButton.disabled = false;
            } finally {
                authFlowInProgress = false;
            }
        };

        // 🔐 LOGIN USER
        window.login = async (event) => {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            console.log('🔐 Login attempt started');
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailPattern.test(email)) {
                console.log('Invalid email format:', email);
                return alert('❌ Please enter a valid email address.');
            }
            if (!password) {
                console.log('No password entered');
                return alert('❌ Please enter your password.');
            }
            
            authFlowInProgress = true;
            console.log('Starting Firebase authentication...');
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('✓ User authenticated, reloading...');
                
                await userCredential.user.reload();
                console.log('✓ User reloaded, verification status:', userCredential.user.emailVerified);
                
                if (!userCredential.user.emailVerified) {
                    console.log('Email not verified, signing out...');
                    await signOut(auth);
                    authFlowInProgress = false;
                    return alert('❌ Please verify your email before logging in. Check your inbox.');
                }
                
                console.log('✓ Email verified, updating UI...');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                window.closeLogin();
                
                // Manually update UI immediately
                const loginArea = document.getElementById('loginArea');
                const mainContent = document.getElementById('mainContent');
                loginArea.innerHTML = `
                    <span style="color: white; margin-right: 10px;">👋 Welcome ${auth.currentUser.displayName || auth.currentUser.email.split('@')[0]}!</span>
                    <button class="logout-btn" onclick="window.logout()">Logout</button>
                `;
                mainContent.style.display = 'block';
                authFlowInProgress = false;
                console.log('✓ Login successful');
                return true;
            } catch (error) {
                console.error('❌ Login error:', error.code, error.message);
                alert('❌ Login failed: ' + getAuthErrorMessage(error));
                authFlowInProgress = false;
            }
            return false;
        };
        
        document.getElementById('loginButton').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            window.login(e);
        });

        // 🚪 LOGOUT
        window.logout = async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error('Logout error:', error);
            }
        };

        // ✨ AUTO LOGIN CHECK (runs on page load)
        onAuthStateChanged(auth, async (user) => {
            const loginArea = document.getElementById('loginArea');
            const mainContent = document.getElementById('mainContent');
            
            if (user) {
                try {
                    await user.reload();
                    if (!auth.currentUser.emailVerified) {
                        console.warn('User email not verified, signing out.');
                        await signOut(auth);
                        loginArea.innerHTML = `
                            <button class="login-btn" onclick="window.showLogin()">🔐 Login</button>
                        `;
                        mainContent.style.display = 'none';
                        return;
                    }
                    console.log('✓ Auth state updated: user verified');
                    loginArea.innerHTML = `
                        <span style="color: white; margin-right: 10px;">👋 Welcome ${auth.currentUser.displayName || auth.currentUser.email.split('@')[0]}!</span>
                        <button class="logout-btn" onclick="window.logout()">Logout</button>
                    `;
                    mainContent.style.display = 'block';
                } catch (error) {
                    console.error('Auth reload failed:', error);
                    mainContent.style.display = 'none';
                }
            } else {
                console.log('✓ Auth state updated: no user');
                loginArea.innerHTML = `
                    <button class="login-btn" onclick="window.showLogin()">🔐 Login</button>
                `;
                mainContent.style.display = 'none';
            }
        });

        // 🎯 CLOSE MODAL ON OUTSIDE CLICK
        document.getElementById('loginModal').onclick = (e) => {
            if (e.target === document.getElementById('loginModal')) {
                window.closeLogin();
            }
        };
    </script>
</body>
</html>
