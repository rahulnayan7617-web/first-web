<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Admin Panel - Rahul's Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .admin-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .admin-login {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background: #fff3cd;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .admin-btn {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .stat {
            flex: 1;
            background: #e3f2fd;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="admin-box">
        <!-- ADMIN LOGIN -->
        <div id="adminLogin">
            <h2 style="text-align:center;">🔑 Admin Login</h2>
            <div class="admin-login">
                <input type="password" id="adminPass" placeholder="Enter Admin Password">
                <button class="admin-btn" onclick="adminLogin()">Login to Admin Panel</button>
            </div>
        </div>

        <!-- ADMIN DASHBOARD (HIDDEN) -->
        <div id="adminDashboard" style="display:none;">
            <h1>👨‍💼 Admin Panel</h1>
            <p>Manage contact form submissions from your main website.</p>

            <div class="stats">
                <div class="stat">
                    <h2 id="totalUsers">0</h2>
                    <p>Total Profiles</p>
                </div>
                <div class="stat">
                    <h2 id="activeUsers">0</h2>
                    <p>Submitted Today</p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Account Email</th>
                        <th>Contact</th>
                        <th>Message</th>
                        <th>Submitted</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable"></tbody>
            </table>

            <div style="margin-top:20px;">
                <button class="admin-btn" onclick="exportUsers()" style="background:#007bff; width:auto;">📊 Export
                    CSV</button>
                <button class="admin-btn" onclick="clearAll()" style="background:#dc3545; width:auto;">🗑️ Delete
                    All</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
        import { getDatabase, ref, get, remove } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDEF3w3xaLBQw3ctkdikywqiXy9hvr00Bg",
            authDomain: "rahul-sfirst-web.firebaseapp.com",
            databaseURL: "https://rahul-sfirst-web-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rahul-sfirst-web",
            storageBucket: "rahul-sfirst-web.firebasestorage.app",
            messagingSenderId: "813239852248",
            appId: "1:813239852248:web:91d29ed494917ad6e30bad",
            measurementId: "G-74DMWXDQRX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        let profiles = {};

        // Attached to 'window' so your HTML buttons can trigger them
        window.adminLogin = function () {
            const password = document.getElementById('adminPass').value;
            signInWithEmailAndPassword(auth, 'rahulnayan010@gmail.com', password)
                .then((userCredential) => {
                    return userCredential.user.reload().then(() => userCredential);
                })
                .then((userCredential) => {
                    if (userCredential.user.email !== 'rahulnayan010@gmail.com') {
                        throw new Error('This Firebase account is not authorized for the admin panel.');
                    }
                    if (!userCredential.user.emailVerified) {
                        return signOut(auth).then(() => {
                            throw new Error('Please verify the admin email before opening the admin panel.');
                        });
                    }
                    document.getElementById('adminLogin').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    window.loadUsers();
                })
                .catch((error) => {
                    alert(`❌ Admin login failed: ${error.message}`);
                    console.error(error);
                });
        }

        window.loadUsers = async function () {
            const tbody = document.getElementById('usersTable');
            tbody.innerHTML = '';
            document.getElementById('totalUsers').textContent = '...';
            document.getElementById('activeUsers').textContent = '...';

            try {
                const snapshot = await get(ref(database, 'profiles'));
                profiles = snapshot.exists() ? snapshot.val() : {};
                const profileList = Object.values(profiles);
                const today = new Date().toDateString();
                const submittedToday = profileList.filter((profile) => profile.submittedAt &&
                    new Date(profile.submittedAt).toDateString() === today).length;

                document.getElementById('totalUsers').textContent = profileList.length;
                document.getElementById('activeUsers').textContent = submittedToday;

                if (!profileList.length) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.textContent = 'No profiles have been submitted yet.';
                    return;
                }

                profileList.sort((first, second) => (second.submittedAt || 0) - (first.submittedAt || 0));
                profileList.forEach((profile) => {
                    const row = tbody.insertRow();
                    const accountCell = row.insertCell();
                    accountCell.textContent = `${profile.username || 'No username'} (${profile.accountEmail || 'Unknown account'})`;
                    const contactCell = row.insertCell();
                    contactCell.textContent = `${profile.name || ''} | ${profile.email || ''} | ${profile.phone || ''}`;
                    const messageCell = row.insertCell();
                    messageCell.textContent = profile.message || '';
                    const dateCell = row.insertCell();
                    dateCell.textContent = profile.submittedAt
                        ? new Date(profile.submittedAt).toLocaleString()
                        : 'Unknown date';
                    const actionCell = row.insertCell();
                    const deleteButton = document.createElement('button');
                    deleteButton.className = 'delete-btn';
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', () => window.deleteUser(profile.uid));
                    actionCell.appendChild(deleteButton);
                });
            } catch (error) {
                console.error('Profile loading failed:', error);
                document.getElementById('totalUsers').textContent = '0';
                document.getElementById('activeUsers').textContent = '0';
                const row = tbody.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 5;
                cell.textContent = 'Could not load profiles. Check your Firebase Database Rules.';
            }
        };

        window.deleteUser = async function (uid) {
            if (confirm('Delete this user?')) {
                try {
                    await remove(ref(database, `profiles/${uid}`));
                    await window.loadUsers();
                } catch (error) {
                    alert('Could not delete this profile. Check your Firebase Database Rules.');
                    console.error('Profile deletion failed:', error);
                }
            }
        };

        window.clearAll = async function () {
            if (confirm('⚠️ Delete ALL users? Cannot undo!')) {
                try {
                    await remove(ref(database, 'profiles'));
                    await window.loadUsers();
                } catch (error) {
                    alert('Could not delete profiles. Check your Firebase Database Rules.');
                    console.error('Profile deletion failed:', error);
                }
            }
        };

        window.exportUsers = function () {
            const profileList = Object.values(profiles);
            const csvValue = (value) => `"${String(value || '').replace(/"/g, '""')}"`;
            const csv = 'Username,AccountEmail,Name,ContactEmail,Phone,Message,SubmittedAt\n' + profileList.map((profile) => [
                profile.username,
                profile.accountEmail,
                profile.name,
                profile.email,
                profile.phone,
                profile.message,
                profile.submittedAt ? new Date(profile.submittedAt).toISOString() : ''
            ].map(csvValue).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'users.csv';
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>

</html>
